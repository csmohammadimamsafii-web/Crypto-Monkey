<style>
:root{--lime:#c6f607;--ink:#000;--white:#fff;--grey:#9a9a9a;--err:#d6002f;--line:#e6e6e6;--mute:#6b6b6b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--lime);font-family:'Inter',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
body.in{background:var(--white)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ================= LOGIN ================= */
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(6px + env(safe-area-inset-bottom,0px));overflow:hidden}
#login h1{font-family:'Nunito','Arial Rounded MT Bold','Varela Round',sans-serif;font-weight:900;font-size:clamp(30px,8.5vw,40px);line-height:.95;letter-spacing:0;margin-top:4px;position:relative;z-index:2}
#login h1 .row{display:flex;align-items:center;gap:10px}
.coin{width:clamp(20px,5.5vw,27px);height:auto;flex:none;transform:rotate(8deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-width:150px;margin-top:10px;position:relative;z-index:2}
.chips span{border:1.5px solid var(--ink);border-radius:999px;padding:3px 8px;font-weight:700;font-size:8px;text-transform:uppercase}
.stage{flex:1;position:relative;min-height:0;margin:-90px -24px 0}
.stage img{position:absolute;right:-9%;bottom:0;height:110%;max-height:none;width:auto;max-width:none;object-fit:contain;object-position:right bottom;filter:brightness(1.05) saturate(1.1) drop-shadow(0 18px 22px rgba(60,90,0,.25))}
.slidewrap{position:relative;z-index:3;margin-top:4px}

/* slider geser */
.slide{position:relative;width:100%;height:52px;background:var(--ink);border-radius:16px;cursor:pointer;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
.slide .lbl{color:var(--white);font:800 11px 'Inter',sans-serif;letter-spacing:.08em;padding-left:40px;pointer-events:none;transition:opacity .1s}
.knob{position:absolute;left:4px;top:4px;bottom:4px;aspect-ratio:1;background:var(--lime);color:var(--ink);border-radius:12px;display:grid;place-items:center;cursor:grab;line-height:1;touch-action:none}
.knob.snap{transition:transform .25s ease}
.knob:active{cursor:grabbing}
.slide.done{background:var(--lime)}
.slide.done .lbl{opacity:0}
.slide.done .knob{background:var(--ink);color:var(--lime)}
.msg{min-height:12px;margin-top:4px;font-weight:700;font-size:10px;text-align:center}
.msg.err{color:var(--err)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes drop{from{transform:translateY(-14px) rotate(-12deg);opacity:0}to{transform:translateY(0) rotate(8deg);opacity:1}}

/* ================= DASHBOARD ================= */
#dash{width:100%;max-width:720px;font-size:12px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#dash :focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.hero{background:var(--ink);color:var(--white);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 22px}
.wave{display:block;width:100%;height:22px;margin-top:-1px;fill:var(--ink)}
.top{display:flex;justify-content:flex-end;align-items:center}
.out{border:0;background:none;color:var(--lime);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.out:hover{background:rgba(198,246,7,.18)}
.sub{color:#bdbdbd;margin-top:8px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--lime);color:var(--ink);border-radius:14px;padding:10px 12px}
.stat small{display:block;font-size:9px;font-weight:700;opacity:.75}
.stat b{display:block;font-size:15px;font-weight:800;margin-top:3px;white-space:nowrap}
.bar{position:sticky;top:0;z-index:5;background:var(--white);padding:12px 18px;border-bottom:1.5px solid var(--ink);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font:600 12px 'Inter',sans-serif;outline:0;background:var(--white)}
.search:focus{box-shadow:0 0 0 3px var(--lime)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--white);padding:7px 12px;font:700 11px 'Inter',sans-serif;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.head,.crow{display:grid;grid-template-columns:30px 1fr auto 62px;gap:10px;align-items:center;padding:0 18px}
.head{padding-top:10px;padding-bottom:8px;font-size:10px;font-weight:700;color:var(--mute)}
.head .r{text-align:right}
.crow{padding-top:11px;padding-bottom:11px;border-top:1px solid var(--line)}
.crow:hover{background:#f7fde0}
.rank{font-weight:700;color:var(--mute)}
.ccoin{display:flex;align-items:center;gap:9px;min-width:0}
.ccoin img{width:26px;height:26px;border-radius:50%;flex:none;background:#f1f1f1}
.ccoin .n{min-width:0}
.ccoin b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccoin small{display:block;font-size:10px;color:var(--mute);margin-top:2px;white-space:nowrap}
.price{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.chg{justify-self:end;min-width:56px;text-align:center;padding:4px 6px;border-radius:999px;font-weight:800;font-size:10px;font-variant-numeric:tabular-nums}
.chg.up{background:var(--lime);color:var(--ink)}
.chg.down{background:#ff8a00;color:var(--ink)}
.crow{cursor:pointer}
.crow.open{background:#f7fde0}
.crow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.detail{background:var(--lime);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;animation:dopen .18s ease-out}
.dinfo{display:flex;gap:16px;flex-wrap:wrap;min-width:0}
.dinfo small{display:block;font-size:9px;font-weight:700;opacity:.7}
.dinfo b{display:block;font-size:11px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.dacts{display:flex;gap:8px;flex:none}
.dbtn{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.dbtn:hover{transform:translateY(-2px)}
.dbtn svg{width:18px;height:18px}
@keyframes dopen{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.state{padding:44px 18px;text-align:center;color:var(--mute);line-height:1.6}
.state button{margin-top:12px;border:0;background:var(--ink);color:var(--lime);border-radius:999px;padding:9px 20px;font:800 12px 'Inter',sans-serif;cursor:pointer}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.foot{margin-top:auto;padding-top:36px}
.foot .wv{display:block;width:100%;height:22px;margin-bottom:-1px;fill:var(--lime)}
.foot .in{background:var(--lime);color:var(--ink);padding:6px 18px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.foot .by{font-size:11px;font-weight:700}
.foot .by a{color:var(--ink);text-underline-offset:3px}
.social{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;list-style:none;padding:0}
.social a{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.social a:hover{transform:translateY(-2px)}
.social svg{width:17px;height:17px}
@media (max-width:380px){.stat b{font-size:13px}.head,.crow{gap:8px}}
@media (prefers-reduced-motion:reduce){.detail{animation:none}.coin,.spin{animation:none}.knob.snap{transition:none}}
</style>
</head>

const $ = id => document.getElementById(id);
const msg = $('msg');
const slide = $('slide'), knob = $('knob');
function setMsg(text, cls) { msg.textContent = text; msg.className = 'msg ' + cls; }

/* ---------- Slider geser kiri → kanan ---------- */
let dragging = false, startX = 0, curX = 0, locked = false;
const maxX = () => slide.clientWidth - knob.offsetWidth - 8;
const setX = x => { curX = x; knob.style.transform = 'translateX(' + x + 'px)'; $('lbl').style.opacity = 1 - Math.min(1, x / (maxX() * .6)); };
function resetKnob() { knob.classList.add('snap'); setX(0); slide.classList.remove('done'); locked = false; }

knob.addEventListener('pointerdown', e => {
  if (locked) return;
  dragging = true; startX = e.clientX - curX;
  knob.classList.remove('snap');
  knob.setPointerCapture(e.pointerId);
  e.preventDefault();
});
knob.addEventListener('pointermove', e => {
  if (!dragging) return;
  setX(Math.max(0, Math.min(maxX(), e.clientX - startX)));
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (curX >= maxX() * .85) attempt(); else resetKnob();
}
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', () => { dragging = false; resetKnob(); });
slide.addEventListener('click', e => {
  if (e.target === slide || e.target.id === 'lbl') setMsg('Geser tombol hijau ke kanan.', '');
});
slide.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); attempt(); }
});

/* ---------- Masuk ---------- */
function attempt() {
  if (locked) return;
  locked = true;
  knob.classList.add('snap'); setX(maxX()); slide.classList.add('done');
  setMsg('Membuka…', '');
  try { sessionStorage.setItem('loggedIn', '1'); } catch (_) {}
  setTimeout(showDash, 400);
}

/* ---------- Ganti halaman ---------- */
function showDash() {
  $('login').hidden = true; $('dash').hidden = false;
  document.body.classList.add('in');
  $('themeColor').content = '#000000';
  document.title = 'Top 100 Crypto';
  window.scrollTo(0, 0);
  try { history.pushState({ page: 'dash' }, ''); } catch (_) {}
  load();
  clearInterval(timer); timer = setInterval(() => { if (!document.hidden) load(true); }, TTL);
}
function showLogin() {
  clearInterval(timer);
  $('dash').hidden = true; $('login').hidden = false;
  toggleSearch(false);
  document.body.classList.remove('in');
  $('themeColor').content = '#c6f607';
  document.title = 'Type The Pass!';
  setMsg('', '');
  knob.classList.remove('snap'); setX(0); slide.classList.remove('done'); locked = false;
}

/* ---------- List crypto ---------- */
const list = $('list');
const cur = 'usd';
let coins = [], timer;

const fmtPrice = v => v == null ? '–' : new Intl.NumberFormat('en-US', {
  style: 'currency', currency: cur.toUpperCase(),
  maximumFractionDigits: v >= 1 ? 2 : 6, minimumFractionDigits: 2
}).format(v);
const fmtCap = v => v == null ? '–' : new Intl.NumberFormat('en-US', {
  style: 'currency', currency: cur.toUpperCase(), notation: 'compact', maximumFractionDigits: 2
}).format(v);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function showState(msg, retry) {
  list.replaceChildren();
  const s = el('div', 'state');
  if (!retry) s.appendChild(el('div', 'spin'));
  s.appendChild(el('div', null, msg));
  if (retry) {
    const b = el('button', null, 'Coba lagi'); b.type = 'button';
    b.onclick = () => load(true); s.appendChild(b);
  }
  list.appendChild(s);
}
let openId = null;
const homes = (() => { try { return JSON.parse(localStorage.getItem('homes_v1')) || {}; } catch (_) { return {}; } })();
const ICON_WEB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>';
const ICON_CHART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3-4 3 3 5-7"/></svg>';

function linkBtn(href, label, svg) {
  const a = el('a', 'dbtn');
  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.title = label; a.setAttribute('aria-label', label); a.innerHTML = svg;
  return a;
}
async function loadHome(id, a) {
  if (homes[id]) { a.href = homes[id]; return; }
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/' + encodeURIComponent(id) +
      '?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false&sparkline=false');
    if (!r.ok) return;
    const j = await r.json();
    const u = ((j.links && j.links.homepage) || []).find(x => /^https?:\/\//i.test(x));
    if (!u) return;
    homes[id] = u;
    try { localStorage.setItem('homes_v1', JSON.stringify(homes)); } catch (_) {}
    a.href = u;
  } catch (_) {}
}
function detailEl(c) {
  const d = el('div', 'detail');
  const info = el('div', 'dinfo');
  [['Vol 24j', fmtCap(c.total_volume)], ['Tertinggi', fmtPrice(c.high_24h)], ['Terendah', fmtPrice(c.low_24h)]].forEach(([k, v]) => {
    const s = el('span'); s.appendChild(el('small', null, k)); s.appendChild(el('b', null, v)); info.appendChild(s);
  });
  const cg = 'https://www.coingecko.com/en/coins/' + encodeURIComponent(c.id);
  const web = linkBtn(cg, 'Website ' + c.name, ICON_WEB);
  const chart = linkBtn(cg, 'Grafik harga ' + c.name, ICON_CHART);
  loadHome(c.id, web);
  const acts = el('div', 'dacts'); acts.append(web, chart);
  d.append(info, acts);
  return d;
}
function toggleRow(row, c) {
  const old = list.querySelector('.detail');
  const wasOpen = old && old.previousElementSibling === row;
  if (old) {
    const pr = old.previousElementSibling;
    if (pr) { pr.setAttribute('aria-expanded', 'false'); pr.classList.remove('open'); }
    old.remove();
  }
  if (wasOpen) { openId = null; return; }
  openId = c.id;
  row.setAttribute('aria-expanded', 'true'); row.classList.add('open');
  row.after(detailEl(c));
}
function render() {
  const term = $('q').value.trim().toLowerCase();
  let rows = coins.filter(c => !term || c.name.toLowerCase().includes(term) || c.symbol.toLowerCase().includes(term));
  if (!rows.length) { list.replaceChildren(el('div', 'state', 'Tidak ada koin yang cocok.')); return; }
  const frag = document.createDocumentFragment();
  rows.forEach(c => {
    const row = el('div', 'crow');
    row.appendChild(el('span', 'rank', c.market_cap_rank));
    const coin = el('div', 'ccoin');
    const img = el('img'); img.src = c.image; img.alt = ''; img.loading = 'lazy';
    const n = el('div', 'n');
    n.appendChild(el('b', null, c.name));
    n.appendChild(el('small', null, c.symbol.toUpperCase() + ' · ' + fmtCap(c.market_cap)));
    coin.append(img, n); row.appendChild(coin);
    row.appendChild(el('div', 'price', fmtPrice(c.current_price)));
    const ch = c.price_change_percentage_24h;
    row.appendChild(el('span', 'chg ' + ((ch ?? 0) >= 0 ? 'up' : 'down'),
      ch == null ? '–' : (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%'));
    row.tabIndex = 0; row.setAttribute('role', 'button'); row.setAttribute('aria-expanded', 'false');
    row.addEventListener('click', () => toggleRow(row, c));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRow(row, c); } });
    frag.appendChild(row);
    if (c.id === openId) { row.setAttribute('aria-expanded', 'true'); row.classList.add('open'); frag.appendChild(detailEl(c)); }
  });
  list.replaceChildren(frag);
}
function stats() {
  const total = coins.reduce((s, c) => s + (c.market_cap || 0), 0);
  const btc = coins.find(c => c.id === 'bitcoin');
  const up = coins.filter(c => (c.price_change_percentage_24h || 0) > 0).length;
  $('sCap').textContent = fmtCap(total);
  $('sDom').textContent = btc && total ? (btc.market_cap / total * 100).toFixed(1) + '%' : '–';
  $('sUp').textContent = up + ' / ' + coins.length;
}
const CACHE_KEY = 'top100_usd_v2', TTL = 5 * 60 * 1000;   // cache & auto-refresh: 5 menit
let lastFetch = 0;
function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Array.isArray(c.data) && c.data.length) return c;
  } catch (_) {}
  return null;
}
function writeCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (_) {}
}
function setUpdated(ts, cached) {
  $('updated').textContent = 'Diperbarui ' + new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + (cached ? ' · dari cache' : '');
}
async function load(force) {
  if (!coins.length) {                       // tampilkan cache dulu supaya langsung muncul
    const c = readCache();
    if (c) { coins = c.data; lastFetch = c.t; stats(); render(); setUpdated(c.t, true); }
  }
  if (coins.length && !force && Date.now() - lastFetch < TTL) return;   // cache masih segar
  if (!coins.length) showState('Memuat 100 koin teratas…', false);
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=' + cur +
      '&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('empty');
    coins = data.map(c => ({
      id: c.id, name: c.name, symbol: c.symbol, image: c.image, market_cap: c.market_cap,
      market_cap_rank: c.market_cap_rank, current_price: c.current_price,
      total_volume: c.total_volume, high_24h: c.high_24h, low_24h: c.low_24h,
      price_change_percentage_24h: c.price_change_percentage_24h
    }));
    lastFetch = Date.now(); writeCache(coins);
    stats(); render(); setUpdated(lastFetch, false);
  } catch (e) {
    if (coins.length) { $('updated').textContent = 'Gagal memperbarui, menampilkan data tersimpan.'; return; }
    showState('Data tidak bisa dimuat. Periksa koneksi internet atau coba lagi sebentar (batas permintaan API gratis).', true);
    $('updated').textContent = 'Gagal memuat data';
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dash').hidden) load(); });
$('q').addEventListener('input', render);

/* Ikon search kanan atas */
function toggleSearch(open) {
  const show = open ?? $('bar').hidden;
  $('bar').hidden = !show;
  $('searchBtn').setAttribute('aria-expanded', show);
  if (show) $('q').focus(); else { $('q').value = ''; render(); }
}
$('searchBtn').addEventListener('click', () => toggleSearch());
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') toggleSearch(false); });

/* Tombol kembali = keluar ke halaman login */
window.addEventListener('popstate', () => {
  if (!$('dash').hidden) {
    try { sessionStorage.removeItem('loggedIn'); } catch (_) {}
    showLogin();
  }
});

/* Sudah login di tab ini? langsung ke list */
try { if (sessionStorage.getItem('loggedIn')) { history.replaceState({ page: 'login' }, ''); showDash(); } } catch (_) {}
</script>
